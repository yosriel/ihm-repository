services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: falabella_ihm
      MYSQL_USER: ihm_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en back/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en back/.env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ihm_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  ihm_mysql_data:
    name: ihm_mysql_data
